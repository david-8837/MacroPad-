<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting ZERO</title>
  <script src="splash-theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #141414; background: #fff; font: 14px system-ui, sans-serif; }
    main { padding: 30px 32px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    img { width: 42px; height: 42px; }
    strong { display: block; font-size: 18px; letter-spacing: .09em; }
    small { color: #646464; letter-spacing: .12em; font-size: 10px; }
    p { color: #646464; margin: 26px 0 0; line-height: 1.5; }
    #error { display: none; }
    button { border: 1px solid #777; background: transparent; color: #141414; padding: 9px 18px; cursor: pointer; margin: 12px 8px 0 0; }
    button:first-of-type { background: #141414; color: #fff; border-color: #141414; }
    button:focus-visible { outline: 2px solid #6fa8ff; outline-offset: 3px; }
    html[data-theme="dark"] body { background: #171b22; color: #edf1f7; color-scheme: dark; }
    html[data-theme="dark"] small, html[data-theme="dark"] p { color: #b5becb; }
    html[data-theme="dark"] button { color: #edf1f7; border-color: #718095; }
    html[data-theme="dark"] button:first-of-type { background: #1351aa; color: #fff; border-color: #1351aa; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="assets/zero.png" alt=""><div><strong>ZERO</strong><small>DECK STUDIO</small></div></div>
    <p id="loading" role="status">Starting the editor…</p>
    <section id="error" role="alert">
      <p>The editor could not start. Try again, or quit and restart the app. If this continues, reinstall from a trusted release.</p>
      <button id="retry" type="button">Try again</button><button id="quit" type="button">Quit</button>
    </section>
  </main>
  <script src="splash.js"></script>
</body>
</html>
